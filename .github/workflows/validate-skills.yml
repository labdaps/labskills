name: Validar skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar estrutura e conteúdo das skills e o marketplace de plugins
        run: python scripts/validate_skills.py
      - name: Testar o validador do marketplace, o install.sh e o validador do grafo da graph-lab
        run: |
          python -m pip install pytest
          python -m pytest tests skills/graph-lab/tests -v

  plugin-validate:
    # Checagem oficial do Claude Code sobre o marketplace.json. Não precisa de
    # credencial. Complementa o teste em Python, que cobre as regras do lab.
    # O --strict transforma aviso em erro: sem ele, um "skils" digitado errado
    # passa com exit 0. Nem com ele o validate acusa caminho de skill que não
    # existe; isso fica com o teste em Python. A versão fica fixa para uma
    # mudança da CLI não quebrar o CI sem aviso; ao subir, confira também os
    # campos aceitos em scripts/validate_marketplace.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate --strict
        env:
          DISABLE_AUTOUPDATER: "1"
        run: npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate . --strict
